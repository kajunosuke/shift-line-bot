name: Daily shift reminder

on:
  # 自動実行(schedule)はcron-job.orgに移行したため無効化。手動実行(workflow_dispatch)のみ残す。
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sf -X POST "${{ secrets.REMINDER_ENDPOINT_URL }}?token=${{ secrets.REMINDER_TRIGGER_TOKEN }}"
