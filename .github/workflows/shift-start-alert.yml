name: Shift start alert

on:
  schedule:
    # 5分おき
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call shift-start-alert endpoint
        run: |
          curl -sf -X POST "${{ secrets.SHIFT_ALERT_ENDPOINT_URL }}?token=${{ secrets.REMINDER_TRIGGER_TOKEN }}"
